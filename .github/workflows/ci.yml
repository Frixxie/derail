name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test --project tests/Derail.Tests -c Release --no-build
      - run: dotnet pack src/Derail -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
