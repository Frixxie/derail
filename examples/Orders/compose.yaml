name: derail-orders

services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Synthetic local data only: trust auth, published on loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: sample
      POSTGRES_DB: orders
      PGUSER: sample
      PGDATABASE: orders
    ports:
      - "127.0.0.1:${ORDERS_DB_PORT:-55432}:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      # TCP, because the init-time server listens only on the Unix socket.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1"]
      interval: 1s
      timeout: 3s
      retries: 30
